<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rennacs{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="logo">◎</span> Rennacs
    </a>
    <a class="nav-link" href="{{ url_for('map_view') }}">Map</a>
    <a class="nav-link" href="{{ url_for('findings_view') }}">Findings</a>
    <form class="searchbar" action="{{ url_for('search') }}" method="get">
      <input type="text" name="q" value="{{ q|default('') }}"
             placeholder="Type to search  —  e.g. port:22 product:nginx"
             autocomplete="off" autofocus>
      <button type="submit">Search</button>
    </form>

  </header>

  <main class="container">
    {% block body %}{% endblock %}
  </main>

  <footer class="foot">
    Rennacs — recorded network observations and potential advisory correlations.
    Scan only assets you own or are explicitly authorized to assess.
  </footer>
</body>
</html>
